name: Runtime checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mqtt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build broker image
        run: docker build -t railwayapp-mqtt:test .
      - name: Verify authentication, healthcheck, persistence and restart
        run: node --test tests/runtime.test.mjs
