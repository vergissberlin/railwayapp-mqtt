version: '3.6'

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      - TZ=Europe/Amsterdam
      # Local dev only — set real credentials via environment, never commit real values
      - MQTT_USER=changeme
      - MQTT_PASS=changeme
      - PUID=${UID}
      - PGID=${GID}
    ports:
      - 1883:1883
      - 8883:8883
      - 9001:9001
    volumes:
      #  - ./data/mqtt/data:/mosquitto/data
      - ./config/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
